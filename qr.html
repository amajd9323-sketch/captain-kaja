    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .lang-controls {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .lang-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .lang-btn.active, .lang-btn:hover {
            background: #ef4444;
            color: #ffffff;
            border-color: #ef4444;
        }

        .lang-btn:focus-visible,
        .btn:focus-visible,
        .btn-secondary:focus-visible {
            outline: 3px solid #f87171;
            outline-offset: 3px;
        }

        .badge {
            background: #ef4444;
            color: #fff;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 0.8rem;
        }

        h1 {
            font-size: 1.9rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            max-width: 500px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1rem;
            max-width: 420px;
        }

        .qr-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 1.8rem;
            border: 4px solid #ef4444;
            box-shadow: 0 15px 40px rgba(239, 68, 68, 0.35);
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .qr-card img {
            display: block;
            width: 280px;
            height: 280px;
            max-width: 65vw;
            max-height: 65vw;
        }

        .url-text {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 0.7rem 1.2rem;
            color: #cbd5e1;
            font-size: 0.9rem;
            word-break: break-all;
            margin-bottom: 1.8rem;
            max-width: 420px;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            background: #ef4444;
            color: white;
            padding: 0.75rem 1.6rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        footer {
            margin-top: 2.5rem;
            color: #64748b;
            font-size: 0.8rem;
            text-align: center;
        }

        /* Clean print output: just the card, no dark background or buttons */
        @media print {
            .lang-controls,
            .btn-group,
            footer {
                display: none;
            }

            body {
                background: #ffffff;
                color: #0f172a;
                min-height: auto;
            }

            .badge {
                background: #ef4444;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .subtitle {
                color: #334155;
            }

            .qr-card {
                box-shadow: none;
                border: 3px solid #ef4444;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .url-text {
                background: #f1f5f9;
                border: 1px solid #cbd5e1;
                color: #334155;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

    <script>
        const translations = {
            pl: {
                title: "Zeskanuj i wesprzyj Kapitan Kaję! ❤️",
                subtitle: "Zeskanuj kod telefonem, aby przejść do strony z wiadomościami wsparcia od całej drużyny.",
                openBtn: "Otwórz stronę 🔗",
                printBtn: "Drukuj 🖨️",
                footerText: "Strona stworzona z miłością dla Kapitanki Kaji | 2026 ❤️"
            },
            en: {
                title: "Scan to support Captain Kaja! ❤️",
                subtitle: "Scan the code with your phone to see support messages from the whole team.",
                openBtn: "Open page 🔗",
                printBtn: "Print 🖨️",
                footerText: "Website made with love for Captain Kaja | 2026 ❤️"
            }
        };

        function switchLanguage(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                const active = btn.getAttribute('data-lang') === lang;
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-pressed', active ? 'true' : 'false');
            });

            const data = translations[lang];
            document.documentElement.lang = lang;
            document.getElementById('title').innerText = data.title;
            document.getElementById('subtitle').innerText = data.subtitle;
            document.getElementById('open-btn').innerText = data.openBtn;
            document.getElementById('print-btn').innerText = data.printBtn;
            document.getElementById('footer-text').innerText = data.footerText;

            localStorage.setItem('kaja_lang', lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('kaja_lang') || 'pl';
            switchLanguage(saved);
        });
    </script>
